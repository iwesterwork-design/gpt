name: Build AgroGuide APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack Android project
        run: |
          test -f AgroGuideAndroid_HC05_cloudbuild.zip
          unzip -q AgroGuideAndroid_HC05_cloudbuild.zip -d source
          cd source/AgroGuideAndroid
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/source/AgroGuideAndroid" >> $GITHUB_ENV
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: source/AgroGuideAndroid
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgroGuide-debug-apk
          path: source/AgroGuideAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
